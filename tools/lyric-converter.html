<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LRC to Lua Converter — Saltoria Tools</title>
  <link rel="stylesheet" href="/assets/css/design-system.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="saltoria-sidebar" class="sidebar"></aside>
    <div class="main-wrapper">
      <header id="saltoria-topbar" class="topbar"></header>
      <main class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">LRC to Lua Lyric Converter</h1>
            <p class="page-desc">Ubah teks lirik bertimestamp (.lrc) menjadi tabel modul Luau siap pakai untuk Roblox Music Player.</p>
          </div>
          <span class="tag tag-cyan">Strict Luau Ready</span>
        </div>

        <div class="grid-2col">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Input Lirik (.LRC)</h2>
              <button class="btn btn-secondary" style="padding:5px 12px;min-height:32px;font-size:12px;" onclick="loadSampleLrc()">Isi Contoh</button>
            </div>
            <div class="form-group">
              <label class="form-label">Judul Lagu / Modul</label>
              <input type="text" id="song-title" class="form-control" value="Saltoria_Track_01" />
            </div>
            <div class="form-group">
              <label class="form-label">Tempel Teks LRC di Bawah Ini</label>
              <textarea id="lrc-input" class="form-textarea" rows="12" placeholder="[00:12.50] Baris lirik pertama&#10;[00:16.20] Baris lirik kedua"></textarea>
            </div>
            <button onclick="convertLrcToLua()" class="btn btn-primary" style="width:100%;">⚡ Generate Tabel Lua</button>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Output Modul Luau</h2>
              <button onclick="copyTextToClipboard('lua-output', 'Kode Lua')" class="btn btn-purple" style="padding:5px 12px;min-height:32px;font-size:12px;">📋 Salin Kode</button>
            </div>
            <div class="form-group">
              <label class="form-label">Hasil Konversi (--!strict)</label>
              <textarea id="lua-output" class="form-textarea" rows="16" readonly placeholder="Hasil kode Lua akan muncul di sini..."></textarea>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/assets/js/app.js"></script>
  <script>
    initSaltoriaLayout("lyric-converter", "Tools / LRC to Lua Converter");

    function loadSampleLrc() {
      document.getElementById("lrc-input").value = `[00:05.20] Selamat datang di Saltoria Studio
[00:09.85] Menembus puncak tertinggi Vierra Peak
[00:14.40] Cahaya neon memandu setiap langkah
[00:19.10] Musik berputar tanpa batas waktu`;
      convertLrcToLua();
    }

    function convertLrcToLua() {
      const raw = document.getElementById("lrc-input").value;
      const title = document.getElementById("song-title").value.trim() || "TrackLyrics";
      const lines = raw.split("\n");
      const regex = /\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
      let entries = [];

      lines.forEach(line => {
        const match = line.match(regex);
        if (match) {
          const mins = parseInt(match[1], 10);
          const secs = parseFloat(match[2]);
          const totalTime = (mins * 60 + secs).toFixed(2);
          const text = match[3].trim().replace(/"/g, '\\"');
          if (text.length > 0) {
            entries.push(`    { time = ${totalTime}, text = "${text}" },`);
          }
        }
      });

      if (entries.length === 0) {
        showToast("Format timestamp [mm:ss.xx] tidak ditemukan.");
        return;
      }

      const output = `--!strict
-- Generated by Saltoria LRC Converter
export type LyricLine = { time: number, text: string }

local ${title}: { LyricLine } = {
${entries.join("\n")}
}

return ${title}`;
      document.getElementById("lua-output").value = output;
      showToast(`Berhasil mengonversi ${entries.length} baris lirik!`);
    }
  </script>
</body>
</html>
